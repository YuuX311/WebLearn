<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="interfaz.css">
    <title>Document</title>
</head>
<body>
    <div class="contenedor">
        <div class="perfil">Perfil del personaje</div>
        <div class="imagen"></div>
        <div class="nivel">
            <div class="nnivel">Nivel</div>
            <div class="col1">
                <div class="barra">
                    <div class="bhp tooltip" data-tooltip="175/200"></div>
                    <div class="bmp tooltip" data-tooltip="75/130" ></div>
                    <div class="bxp tooltip" data-tooltip="256/879"></div>
                </div>
                <div class="atr">
                    <div>HP</div>
                    <div>MP</div>
                    <div>XP</div>
                </div>
            </div>
        </div>
        <div class="stats">
            <div>Estadisticas</div>
            <div class="col2">
                <div class="atr">
                    <div>Fuerza</div>
                    <div>Defensa</div>
                    <div>Magia</div>
                    <div>Agilidad</div>
                </div>
                <div class="barra">
                    <div class="bfuerza tooltip" data-tooltip="70"></div>
                    <div class="bdefensa tooltip" data-tooltip="40"></div>
                    <div class="bmagia tooltip" data-tooltip="10"></div>
                    <div class="bagilidad tooltip" data-tooltip="65"></div>
                </div>
            </div>
        </div>      
        <div class="equipo">
            <div>Equipo</div>
            <div class="lista">
                <div>Espada</div>
                <div>Armadura</div>
                <div>Anillo</div>
            </div>
        </div>
            
        <div class="skills">
            <div>Habilidades</div>
            <div class="skill1">
                <div>Fuego</div>
                <div>Curar</div>
                <div>Golpe</div>
                <div>Escudo</div>
            </div>
        </div>
            
    </div>
</body>
</html>
