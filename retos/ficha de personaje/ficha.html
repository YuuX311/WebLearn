<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="fichacss.css">
   <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chau+Philomene+One:ital@0;1&display=swap" rel="stylesheet">
    <title>Ficha de personaje</title>
</head>
<body>
    <div class="contenedor">
        <div class="fila1">
            <div class="nombre">NOMBRE</div>
            <div class="clase">CLASE</div>
            <div class="titulo">TITULO</div>
        </div>
        <div class="fila2">
            <div class="foto">
                <img src="char.jpg" alt="">
            </div>
            <div class="hpmp">
                <div class="hp">HP</div>
                <div class="hpbarra"></div>
                <div class="hpnum">820/1200</div>
                <div class="mp">MP</div>
                <div class="mpbarra"></div>
                <div class="mpnum">70/150</div>
            </div>
            <div class="xp">
                <div class="lvl1">NIVEL 50</div>
                <div class="xp1">EXP</div>
                <div class="barraxp"></div>
                <div class="xp2">xp: 1576/2561</div>
            </div>
        </div>
            
        <div class="fila3">
            <div class="stat1">
                <div>ESTADISTICAS</div>
                <div class="stat2">
                    <div class="stat3">
                        <div>FUERZA</div>
                        <div>DEFENSA</div>
                        <div>MAGIA</div>
                        <div>RESISTENCIA</div>
                        <div>AGILIDAD</div>
                        <div>SUERTE</div>
                    </div>
                    <div class="stat4">
                        <div class="fuerza"></div>
                        <div class="defensa"></div>
                        <div class="magia"></div>
                        <div class="resistencia"></div>
                        <div class="agilidad"></div>
                        <div class="suerte"></div>
                    </div>
                    <div class="stat5">
                        <div>90</div>
                        <div>80</div>
                        <div>20</div>
                        <div>30</div>
                        <div>60</div>
                        <div>40</div>
                    </div>
                </div>
            </div>
            <div class="equip">
                <div>EQUIPO</div>
                <div class="tooltip" data-tooltip="+35 DAÑO 
                Espada común
                Daño fisico">ESPADA LARGA</div>
                <div class="tooltip" data-tooltip="+20 DEFENSA
                Armadura común
                Defensa fisica">ARMADURA DE ACERO</div>
                <div class="tooltip" data-tooltip="+10 RESISTENCIA
                Anillo común
                Defensa mágica">ANILLO PROTECTOR</div>
            </div>
            <div class="skill">
                <div>HABILIDADES</div>
                <div>HABILIDAD 1</div>
                <div>HABILIDAD 2</div>
                <div>HABILIDAD 3</div>
                <div>HABILIDAD 4</div>
            </div>
        </div>
        <div class="fila4">
            <div class="lore">
                <p>LORE</p>
            </div>
        </div>
    </div>
</body>
</html>
